name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: no job here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The name must contain "test": the test suite refuses to truncate anything else.
          POSTGRES_DB: spotfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotfinder_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotfinder_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      # Migrations are tested as a unit: forward, no model drift, fully reversible, forward again.
      - name: Migrate up
        run: alembic upgrade head

      - name: Models match migrations
        run: alembic check

      - name: Migrate down to empty
        run: alembic downgrade base

      - name: Migrate up again
        run: alembic upgrade head

      - name: Seed twice (second run must insert nothing)
        run: |
          python scripts/seed.py
          output=$(python scripts/seed.py 2>&1)
          echo "$output"
          echo "$output" | grep -q "0 inserted, 8 already present"

      - name: OpenAPI export is current
        run: python scripts/export_openapi.py --check

      - name: Tests
        run: pytest -q

      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt

  web:
    name: Web (types, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The web app lands in a later deliverable. Until next.config.ts exists, this job passes
      # without doing anything, so it can already be a required status check.
      - name: Detect web app
        id: detect
        run: echo "present=$([ -f apps/web/next.config.ts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Types are generated from the API's OpenAPI schema. If the schema changed and the types were
      # not regenerated, the diff fails here instead of in production.
      - name: API types are current
        if: steps.detect.outputs.present == 'true'
        run: |
          pnpm generate
          git diff --exit-code packages/shared-types/src/api.d.ts

      - name: Type-check
        if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm lint

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: pnpm build
        env:
          # Placeholders: the build needs the variables to exist, not to work.
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan history too: a key removed in a later commit is still leaked
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
